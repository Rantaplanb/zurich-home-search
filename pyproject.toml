[project]
name = "homegate-triage-assistant"
version = "0.1.0"
description = "Local-first Homegate triage assistant for Zurich rental search"
authors = [
    { name = "Loukas Mertzanis", email = "loukas.mertzanis@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=2.30.0",
    "playwright>=1.58.0",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.22",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.43.0",
]

[project.scripts]
homegate-triage-assistant = "homegate_triage_assistant:main"
flatfox-fetch = "homegate_triage_assistant.flatfox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
